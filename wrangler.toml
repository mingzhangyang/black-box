name = "black-box"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false

[[kv_namespaces]]
binding = "BLACK-BOX-SHARE"
id = "9a6ec12ee19243ebb92eff3ead035d52"

[ai]
binding = "AI"
remote = true

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "218701"
simple = { limit = 10, period = 60 }

[vars]
AI_MODEL = "@cf/zai-org/glm-4.7-flash"

[assets]
directory = "./dist"
binding = "ASSETS"
